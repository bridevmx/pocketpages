name: bun-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run tests with coverage
        run: bun test --coverage
        working-directory: ./packages/pocketpages/src/lib
      - name: Run EJS plugin tests
        run: bun test
        working-directory: ./packages/plugins/ejs
      - name: Run plugin tests
        run: |
          for plugin in security session forms pagination rbac i18n seo page-cache; do
            echo "== $plugin"
            (cd "packages/plugins/$plugin" && bun test)
          done
